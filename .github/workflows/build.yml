name: build
on: 
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build
        run: mkdir docs && npx marked -i README.md -o docs/index.html

      - name: Deploy
        uses: ./
        with:
          directory: docs
